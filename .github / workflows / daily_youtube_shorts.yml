name: Daily Logic Malayalam Shorts + Reels Automation

on:
  schedule:
    # Runs every day at 12:30 UTC (18:00 IST / 6:00 PM Kerala Time)
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-and-publish-daily-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg and Malayalam Unicode fonts for burned-in subtitles
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-smc-manjari

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai edge-tts requests pydantic google-api-python-client google-auth google-auth-oauthlib

      - name: Run Daily Logic Malayalam generator & publisher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY_STATUS: "public"
          TTS_VOICE: "ml-IN-MidhunNeural"
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: |
          python generate_short.py

      - name: Commit updated topic history (prevents duplicate topics)
        run: |
          if [ -f used_topics.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add used_topics.json
            git diff --staged --quiet || git commit -m "chore: record published Malayalam topic [skip ci]"
            git push
          fi

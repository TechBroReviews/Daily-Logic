name: Daily Logic Malayalam Shorts + Reels Automation

on:
  schedule:
    # 12:30 UTC = 6:00 PM IST -> Generate video, upload YouTube (Private), cache for IG & FB
    - cron: "30 12 * * *"
    # 13:30 UTC = 7:00 PM IST -> Publish the same video to Instagram Reels
    - cron: "30 13 * * *"
    # 14:30 UTC = 8:00 PM IST -> Publish the same video to Facebook Page Reels
    - cron: "30 14 * * *"
  workflow_dispatch:
    inputs:
      action_mode:
        description: "Run mode"
        required: false
        default: "full_6pm_build"
        type: choice
        options:
          - "full_6pm_build"
          - "publish_ig_now"
          - "publish_fb_now"

permissions:
  contents: write
  actions: read

jobs:
  build-youtube-6pm:
    if: github.event.schedule == '30 12 * * *' || github.event.inputs.action_mode == 'full_6pm_build'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg, HarfBuzz (raqm), and Malayalam Unicode fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libharfbuzz0b libfribidi0 libraqm0 fonts-noto-core fonts-smc-manjari

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow google-genai edge-tts requests pydantic google-api-python-client google-auth google-auth-oauthlib

      - name: Run 6:00 PM IST generator (YouTube Private + cache for IG/FB Reels)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY_STATUS: "private"
          TTS_VOICE: "ml-IN-MidhunNeural"
        run: |
          python generate_short.py

      - name: Cache rendered video for 7:00 PM IG & 8:00 PM FB Reels (1-day retention)
        if: hashFiles('build_short/final_short.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: daily-ig-reel-handoff
          path: |
            build_short/final_short.mp4
            build_short/meta_payload.json
          retention-days: 1

      - name: Commit updated topic history
        run: |
          if [ -f used_topics.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add used_topics.json
            git diff --staged --quiet || git commit -m "chore: record published Malayalam topic [skip ci]"
            git push
          fi

  publish-instagram-reel-7pm:
    if: github.event.schedule == '30 13 * * *' || github.event.inputs.action_mode == 'publish_ig_now'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download today's rendered video from latest 6:00 PM IST run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --workflow="daily_youtube_shorts.yml" --status=success --limit=1 --json databaseId -q '.[0].databaseId')
          if [ -n "$RUN_ID" ]; then
            mkdir -p build_short
            gh run download "$RUN_ID" --name daily-ig-reel-handoff --dir build_short
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies for Meta Graph API
        run: |
          pip install requests pillow google-genai edge-tts pydantic google-api-python-client google-auth google-auth-oauthlib

      - name: Publish to Instagram Reels at 7:00 PM IST
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          python generate_short.py --publish-ig-only

  publish-facebook-reel-8pm:
    if: github.event.schedule == '30 14 * * *' || github.event.inputs.action_mode == 'publish_fb_now'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download today's rendered video from latest 6:00 PM IST run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --workflow="daily_youtube_shorts.yml" --status=success --limit=1 --json databaseId -q '.[0].databaseId')
          if [ -n "$RUN_ID" ]; then
            mkdir -p build_short
            gh run download "$RUN_ID" --name daily-ig-reel-handoff --dir build_short
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies for Meta Graph API
        run: |
          pip install requests pillow google-genai edge-tts pydantic google-api-python-client google-auth google-auth-oauthlib

      - name: Publish to Facebook Page Reels at 8:00 PM IST
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_VIDEO_STATE: "PUBLISHED"
        run: |
          python generate_short.py --publish-fb-only

name: Daily Logic Malayalam Long Videos (Tue/Thu/Sun 8:30 PM IST)

on:
  schedule:
    # 14:00 UTC = 7:30 PM IST (Tue, Thu, Sun) -> Build 8-10 min video, upload YouTube Private (publishAt 8:30 PM IST)
    - cron: "0 14 * * 2,4,0"
    # 15:00 UTC = 8:30 PM IST (Tue, Thu, Sun) -> Publish cached video to Facebook Page Videos
    - cron: "0 15 * * 2,4,0"
  workflow_dispatch:
    inputs:
      action_mode:
        description: "Run mode"
        required: false
        default: "full_730pm_build"
        type: choice
        options:
          - "full_730pm_build"
          - "publish_fb_now"
      category_override:
        description: "Video series type"
        required: false
        default: "auto_by_day"
        type: choice
        options:
          - "auto_by_day"
          - "myths_busted"
          - "how_it_works"
          - "why_designed"

permissions:
  contents: write
  actions: read

jobs:
  build-long-video-730pm:
    if: github.event.schedule == '0 14 * * 2,4,0' || github.event.inputs.action_mode == 'full_730pm_build'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg, HarfBuzz (raqm), and Malayalam Unicode fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libharfbuzz0b libfribidi0 libraqm0 fonts-noto-core fonts-smc-manjari

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow google-genai edge-tts requests pydantic google-api-python-client google-auth google-auth-oauthlib

      - name: Build 8-10 min video & upload to YouTube (Private -> 8:30 PM IST)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY_STATUS: "private"
          TTS_VOICE: "ml-IN-MidhunNeural"
          LONG_CATEGORY: ${{ github.event.inputs.category_override || 'auto_by_day' }}
        run: |
          python generate_long_video.py

      - name: Cache rendered long video for 8:30 PM IST Facebook publish (1-day retention)
        if: hashFiles('build_long/long_video.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: long-video-fb-handoff
          path: |
            build_long/long_video.mp4
            build_long/long_thumb.jpg
            build_long/long_meta.json
          retention-days: 1

      - name: Commit updated long video history
        run: |
          if [ -f used_long_topics.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add used_long_topics.json
            if ! git diff --staged --quiet; then
              git commit -m "chore: record published long video topic [skip ci]"
              git pull --rebase -X ours origin main || true
              git push
            fi
          fi

  publish-facebook-long-830pm:
    if: github.event.schedule == '0 15 * * 2,4,0' || github.event.inputs.action_mode == 'publish_fb_now'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest cached long video
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build_long
          for RID in $(gh run list --workflow="long_videos.yml" --status=success --limit=10 --json databaseId -q '.[].databaseId'); do
            if gh run download "$RID" --name long-video-fb-handoff --dir build_long 2>/dev/null; then
              echo "Downloaded long-video-fb-handoff from run $RID"
              break
            fi
          done

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install requests pillow google-genai edge-tts pydantic google-api-python-client google-auth google-auth-oauthlib

      - name: Publish Long Video to Facebook Page at 8:30 PM IST
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: |
          python generate_long_video.py --publish-fb-only
